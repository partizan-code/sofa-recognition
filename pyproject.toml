[project]
name = "vision-test"
version = "0.1.0"
description = "Local Python sandbox for vision experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7,<1",
    "numpy>=2.5.5",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = [".cache", "data"]
target-version = "py313"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
